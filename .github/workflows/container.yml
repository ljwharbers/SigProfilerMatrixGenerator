name: Build sigprofiler container

on:
  push:
    branches: ["container/chm13"]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/ljwharbers/sigprofiler
  SIF_IMAGE: ghcr.io/ljwharbers/sigprofiler-sif
  # Commit of worktree-chm13-support (SigProfilerSuite/SigProfilerMatrixGenerator#250) to install.
  SPMG_COMMIT: 28a9ce8
  # Commit of ljwharbers/SigProfilerAssignment@chm13-t2t-support to install.
  SPA_COMMIT: 7417dda
  SPMG_VERSION: 1.3.6

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute tag
        id: tag
        run: echo "tag=${SPMG_VERSION}-chm13-${SPMG_COMMIT}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push OCI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE }}:chm13
          build-args: |
            SPMG_COMMIT=${{ env.SPMG_COMMIT }}
            SPA_COMMIT=${{ env.SPA_COMMIT }}
            SPMG_VERSION=${{ env.SPMG_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          IMG="${IMAGE}:${TAG}"
          docker run --rm "$IMG" ps --version
          docker run --rm "$IMG" SigProfilerMatrixGenerator matrix_generator --help > spmg_help.txt
          head -n 3 spmg_help.txt
          docker run --rm "$IMG" SigProfilerAssignment cosmic_fit --help > spa_help.txt
          head -n 3 spa_help.txt
          docker run --rm "$IMG" python - <<'PY'
          import importlib.metadata as md, os
          from SigProfilerMatrixGenerator.scripts import reference_genome_manager as rgm
          import SigProfilerAssignment as spa
          print("SigProfilerMatrixGenerator", md.version("SigProfilerMatrixGenerator"))
          print("SigProfilerAssignment", md.version("SigProfilerAssignment"))
          assert "CHM13-T2T" in rgm.CHECKSUMS and len(rgm.CHECKSUMS["CHM13-T2T"]) == 24
          ref = os.path.join(spa.__path__[0], "data", "Reference_Signatures", "CHM13-T2T")
          files = sorted(os.listdir(ref))
          assert "COSMIC_v3.6_SBS_CHM13-T2T.txt" in files and "COSMIC_v3.6_DBS_CHM13-T2T.txt" in files, files
          print("CHM13-T2T reference signatures:", len(files), "files")
          PY
          # Functional check: fit the bundled test matrix against the CHM13-T2T signatures.
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/work" -w /work "$IMG" python - <<'PY'
          import os, pandas as pd
          import SigProfilerAssignment as spa
          from SigProfilerAssignment import Analyzer as An
          m = os.path.join(spa.__path__[0], "data", "tests", "txt_input", "sample_matrix_SBS.txt")
          An.cosmic_fit(samples=m, output="spa_smoke", input_type="matrix", genome_build="CHM13-T2T",
                        cosmic_version=3.6, make_plots=False, volume="spa_smoke/volume", verbose=False)
          act = pd.read_csv("spa_smoke/Assignment_Solution/Activities/Assignment_Solution_Activities.txt", sep="\t", index_col=0)
          assert act.shape[0] > 0 and act.to_numpy().sum() > 0, act
          meta = open("spa_smoke/JOB_METADATA_SPA.txt").read()
          assert "reference_genome: CHM13-T2T" in meta, meta
          print("cosmic_fit on CHM13-T2T OK:", act.shape)
          PY

  build-sif:
    needs: build-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Apptainer
        uses: eWaterCycle/setup-apptainer@v2
        with:
          apptainer-version: 1.4.4

      - name: Compute tag
        id: tag
        run: echo "tag=${SPMG_VERSION}-chm13-${SPMG_COMMIT}" >> "$GITHUB_OUTPUT"

      - name: Build SIF from the pushed OCI image
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          APPTAINER_DOCKER_USERNAME: ${{ github.actor }}
          APPTAINER_DOCKER_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          apptainer build sigprofiler.sif "docker://${IMAGE}:${TAG}"
          apptainer exec sigprofiler.sif SigProfilerMatrixGenerator matrix_generator --help > /dev/null
          apptainer exec sigprofiler.sif SigProfilerAssignment cosmic_fit --help > /dev/null
          ls -lh sigprofiler.sif

      - name: Push SIF to GHCR via ORAS
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | apptainer remote login --username "${{ github.actor }}" --password-stdin oras://ghcr.io
          apptainer push sigprofiler.sif "oras://${SIF_IMAGE}:${TAG}"
          apptainer push sigprofiler.sif "oras://${SIF_IMAGE}:chm13"
          echo "pushed oras://${SIF_IMAGE}:${TAG}"
